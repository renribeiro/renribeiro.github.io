{% assign news_items = site.data.news | sort: 'date' | reverse %}
{% if news_items.size > 0 %}
  {% assign news_limit = include.limit | default: 5 %}
  <section class="news px-1 mb-5" aria-labelledby="news-title">
    <h2 id="news-title">News</h2>
    <div id="news-timeline">
      {% include news-timeline.html items=news_items limit=news_limit %}
    </div>
    {% if news_items.size > news_limit %}
      <button class="news-toggle mt-3" type="button" aria-expanded="false" aria-controls="news-timeline" hidden>
        <span class="news-toggle-label">Show older news</span>
        <i class="fas fa-angle-down fa-fw news-chevron" aria-hidden="true"></i>
      </button>
      <script src="{{ '/assets/js/news.js' | relative_url }}" defer></script>
    {% endif %}
  </section>
{% endif %}
