{% assign favicon_path = '/assets/img/favicons/' | relative_url %}
<script src="{{ '/assets/js/favicon-theme.js' | relative_url }}" data-favicon-path="{{ favicon_path }}"></script>
<noscript><link rel="icon" type="image/svg+xml" href="{{ favicon_path }}favicon.svg"></noscript>
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}apple-touch-icon.png">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}site.webmanifest">
{% endif %}
